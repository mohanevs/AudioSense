name: ✨ Feature request
description: Suggest an idea for AudioSense
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Include example API usage if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'm willing to work on this myself
