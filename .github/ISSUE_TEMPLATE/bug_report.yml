name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet is ideal.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / traceback
      render: shell
  - type: input
    id: version
    attributes:
      label: AudioSense version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [CPU, GPU (CUDA), Apple Silicon (MPS)]
  - type: input
    id: audio
    attributes:
      label: Audio format / duration
      description: Please don't upload private recordings.
      placeholder: "mp3, 10 s, 44.1 kHz"
